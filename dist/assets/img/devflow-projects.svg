<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#10161D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bgGrad2)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#10161D" stroke="#26313D" stroke-width="1"/>
  <rect x="24" y="14" width="32" height="32" rx="8" fill="#6366F1"/>
  <text x="33" y="36" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold">D</text>
  <text x="68" y="36" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">DevFlow</text>
  <text x="135" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">/ Projects Workspace</text>

  <rect x="1040" y="14" width="130" height="32" rx="6" fill="#6366F1"/>
  <text x="1060" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">+ New Project</text>

  <!-- Header -->
  <g transform="translate(24, 85)">
    <text x="0" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">Projects Hub</text>
    <text x="0" y="44" fill="#64748B" font-family="sans-serif" font-size="13">Manage software roadmaps, milestone progress, and team assignments.</text>

    <!-- Search & Filter Controls -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="340" height="38" rx="8" fill="#151C24" stroke="#26313D"/>
      <text x="36" y="24" fill="#64748B" font-family="sans-serif" font-size="12">Search projects by name, key, description...</text>

      <rect x="360" y="0" width="160" height="38" rx="8" fill="#151C24" stroke="#26313D"/>
      <text x="375" y="24" fill="#94A3B8" font-family="sans-serif" font-size="12">Status: All Statuses ▾</text>

      <rect x="535" y="0" width="160" height="38" rx="8" fill="#151C24" stroke="#26313D"/>
      <text x="550" y="24" fill="#94A3B8" font-family="sans-serif" font-size="12">Priority: All Priorities ▾</text>
    </g>

    <!-- Project Cards Grid -->
    <!-- Card 1: API Gateway -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="560" height="200" rx="12" fill="#10161D" stroke="#26313D"/>
      <rect x="20" y="20" width="40" height="24" rx="4" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.3"/>
      <text x="30" y="36" fill="#818CF8" font-family="sans-serif" font-size="11" font-weight="bold">API</text>

      <rect x="70" y="20" width="60" height="24" rx="4" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="82" y="36" fill="#34D399" font-family="sans-serif" font-size="11">Active</text>

      <rect x="140" y="20" width="52" height="24" rx="4" fill="#F97316" fill-opacity="0.1" stroke="#F97316" stroke-opacity="0.3"/>
      <text x="150" y="36" fill="#FB923C" font-family="sans-serif" font-size="11">High</text>

      <text x="20" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">API Gateway Modernization</text>
      <text x="20" y="98" fill="#94A3B8" font-family="sans-serif" font-size="12">Modern authentication, JWT rotation, and gateway rate limiting services.</text>

      <!-- Progress bar -->
      <text x="20" y="135" fill="#64748B" font-family="sans-serif" font-size="11">Progress</text>
      <text x="540" y="135" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">40%</text>
      <rect x="20" y="142" width="520" height="6" rx="3" fill="#151C24"/>
      <rect x="20" y="142" width="208" height="6" rx="3" fill="#38BDF8"/>

      <text x="20" y="175" fill="#64748B" font-family="sans-serif" font-size="11">5 issues · 3 team members</text>
      <text x="540" y="175" fill="#34D399" font-family="sans-serif" font-size="11" text-anchor="end">45 days remaining</text>
    </g>

    <!-- Card 2: Payment Service -->
    <g transform="translate(590, 120)">
      <rect x="0" y="0" width="560" height="200" rx="12" fill="#10161D" stroke="#26313D"/>
      <rect x="20" y="20" width="40" height="24" rx="4" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.3"/>
      <text x="30" y="36" fill="#818CF8" font-family="sans-serif" font-size="11" font-weight="bold">PAY</text>

      <rect x="70" y="20" width="60" height="24" rx="4" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="82" y="36" fill="#34D399" font-family="sans-serif" font-size="11">Active</text>

      <rect x="140" y="20" width="60" height="24" rx="4" fill="#EF4444" fill-opacity="0.1" stroke="#EF4444" stroke-opacity="0.3"/>
      <text x="150" y="36" fill="#F87171" font-family="sans-serif" font-size="11">Critical</text>

      <text x="20" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Payment Service</text>
      <text x="20" y="98" fill="#94A3B8" font-family="sans-serif" font-size="12">Payment orchestration, Stripe 3DS challenges, and settlement reconciliation.</text>

      <text x="20" y="135" fill="#64748B" font-family="sans-serif" font-size="11">Progress</text>
      <text x="540" y="135" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">20%</text>
      <rect x="20" y="142" width="520" height="6" rx="3" fill="#151C24"/>
      <rect x="20" y="142" width="104" height="6" rx="3" fill="#38BDF8"/>

      <text x="20" y="175" fill="#64748B" font-family="sans-serif" font-size="11">5 issues · 2 team members</text>
      <text x="540" y="175" fill="#34D399" font-family="sans-serif" font-size="11" text-anchor="end">75 days remaining</text>
    </g>

    <!-- Card 3: E-Commerce Platform -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="560" height="200" rx="12" fill="#10161D" stroke="#26313D"/>
      <rect x="20" y="20" width="100" height="24" rx="4" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.3"/>
      <text x="30" y="36" fill="#818CF8" font-family="sans-serif" font-size="11" font-weight="bold">E-COMMERCE</text>

      <rect x="130" y="20" width="60" height="24" rx="4" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="142" y="36" fill="#34D399" font-family="sans-serif" font-size="11">Active</text>

      <text x="20" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">E-Commerce Management Platform</text>
      <text x="20" y="98" fill="#94A3B8" font-family="sans-serif" font-size="12">Cart inventory locking, faceted catalog search, and EU VAT calculators.</text>

      <text x="20" y="135" fill="#64748B" font-family="sans-serif" font-size="11">Progress</text>
      <text x="540" y="135" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">20%</text>
      <rect x="20" y="142" width="520" height="6" rx="3" fill="#151C24"/>
      <rect x="20" y="142" width="104" height="6" rx="3" fill="#38BDF8"/>

      <text x="20" y="175" fill="#64748B" font-family="sans-serif" font-size="11">5 issues · 3 team members</text>
      <text x="540" y="175" fill="#34D399" font-family="sans-serif" font-size="11" text-anchor="end">30 days remaining</text>
    </g>

    <!-- Card 4: Boutique Website -->
    <g transform="translate(590, 340)">
      <rect x="0" y="0" width="560" height="200" rx="12" fill="#10161D" stroke="#26313D"/>
      <rect x="20" y="20" width="80" height="24" rx="4" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.3"/>
      <text x="30" y="36" fill="#818CF8" font-family="sans-serif" font-size="11" font-weight="bold">BOUTIQUE</text>

      <rect x="110" y="20" width="60" height="24" rx="4" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-opacity="0.3"/>
      <text x="122" y="36" fill="#FBBF24" font-family="sans-serif" font-size="11">Planning</text>

      <text x="20" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Boutique Website</text>
      <text x="20" y="98" fill="#94A3B8" font-family="sans-serif" font-size="12">Mobile lookbook masonry gallery, Instagram API cache, and wishlist sync.</text>

      <text x="20" y="135" fill="#64748B" font-family="sans-serif" font-size="11">Progress</text>
      <text x="540" y="135" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">20%</text>
      <rect x="20" y="142" width="520" height="6" rx="3" fill="#151C24"/>
      <rect x="20" y="142" width="104" height="6" rx="3" fill="#38BDF8"/>

      <text x="20" y="175" fill="#64748B" font-family="sans-serif" font-size="11">5 issues · 2 team members</text>
      <text x="540" y="175" fill="#34D399" font-family="sans-serif" font-size="11" text-anchor="end">60 days remaining</text>
    </g>
  </g>
</svg>
